<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Cover — Hugo theme Lumenveil dev notes (Part 3)</title>
  <desc>A go board with placed stones, surrounded by four small icons representing gallery, code highlighting, douban-card, and one-way like button. No text.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0f0f1c"/>
    </linearGradient>
    <radialGradient id="aurora-purple" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora-cyan" cx="82%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stone-black" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="stone-white" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ebebeb"/>
      <stop offset="100%" stop-color="#c5c5c5"/>
    </radialGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1612"/>
      <stop offset="100%" stop-color="#1a1310"/>
    </linearGradient>
    <radialGradient id="stone-highlight" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="stone-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#aurora-purple)"/>
  <rect width="1200" height="675" fill="url(#aurora-cyan)"/>

  <!-- Center go board (19x19, 18 cells of 20px = 360px + 20px margin each side = 400px board) -->
  <g transform="translate(400, 137)">
    <rect width="400" height="400" fill="url(#board)" rx="6"/>
    <rect width="400" height="400" fill="none" stroke="#4a3520" stroke-width="1.5" opacity="0.6" rx="6"/>
    <g stroke="#9a7048" stroke-width="0.6" opacity="0.55">
      <line x1="20" y1="20" x2="380" y2="20"/>
      <line x1="20" y1="40" x2="380" y2="40"/>
      <line x1="20" y1="60" x2="380" y2="60"/>
      <line x1="20" y1="80" x2="380" y2="80"/>
      <line x1="20" y1="100" x2="380" y2="100"/>
      <line x1="20" y1="120" x2="380" y2="120"/>
      <line x1="20" y1="140" x2="380" y2="140"/>
      <line x1="20" y1="160" x2="380" y2="160"/>
      <line x1="20" y1="180" x2="380" y2="180"/>
      <line x1="20" y1="200" x2="380" y2="200"/>
      <line x1="20" y1="220" x2="380" y2="220"/>
      <line x1="20" y1="240" x2="380" y2="240"/>
      <line x1="20" y1="260" x2="380" y2="260"/>
      <line x1="20" y1="280" x2="380" y2="280"/>
      <line x1="20" y1="300" x2="380" y2="300"/>
      <line x1="20" y1="320" x2="380" y2="320"/>
      <line x1="20" y1="340" x2="380" y2="340"/>
      <line x1="20" y1="360" x2="380" y2="360"/>
      <line x1="20" y1="380" x2="380" y2="380"/>
      <line x1="20" y1="20" x2="20" y2="380"/>
      <line x1="40" y1="20" x2="40" y2="380"/>
      <line x1="60" y1="20" x2="60" y2="380"/>
      <line x1="80" y1="20" x2="80" y2="380"/>
      <line x1="100" y1="20" x2="100" y2="380"/>
      <line x1="120" y1="20" x2="120" y2="380"/>
      <line x1="140" y1="20" x2="140" y2="380"/>
      <line x1="160" y1="20" x2="160" y2="380"/>
      <line x1="180" y1="20" x2="180" y2="380"/>
      <line x1="200" y1="20" x2="200" y2="380"/>
      <line x1="220" y1="20" x2="220" y2="380"/>
      <line x1="240" y1="20" x2="240" y2="380"/>
      <line x1="260" y1="20" x2="260" y2="380"/>
      <line x1="280" y1="20" x2="280" y2="380"/>
      <line x1="300" y1="20" x2="300" y2="380"/>
      <line x1="320" y1="20" x2="320" y2="380"/>
      <line x1="340" y1="20" x2="340" y2="380"/>
      <line x1="360" y1="20" x2="360" y2="380"/>
      <line x1="380" y1="20" x2="380" y2="380"/>
    </g>
    <!-- Star points (hoshi) at 4-4, 4-10, 4-16, 10-4, 10-10, 10-16, 16-4, 16-10, 16-16 (board coords 0-18, scaled 20-380 with offset 20) -->
    <g fill="#9a7048" opacity="0.7">
      <circle cx="20" cy="20" r="3"/>
      <circle cx="200" cy="20" r="3"/>
      <circle cx="380" cy="20" r="3"/>
      <circle cx="20" cy="200" r="3"/>
      <circle cx="200" cy="200" r="3"/>
      <circle cx="380" cy="200" r="3"/>
      <circle cx="20" cy="380" r="3"/>
      <circle cx="200" cy="380" r="3"/>
      <circle cx="380" cy="380" r="3"/>
    </g>
    <!-- Go stones (10 total: 5 black + 5 white) -->
    <g filter="url(#stone-shadow)">
      <!-- Black stones -->
      <circle cx="20" cy="20" r="11" fill="url(#stone-black)"/>
      <circle cx="380" cy="380" r="11" fill="url(#stone-black)"/>
      <circle cx="200" cy="200" r="11" fill="url(#stone-black)"/>
      <circle cx="140" cy="320" r="11" fill="url(#stone-black)"/>
      <circle cx="320" cy="80" r="11" fill="url(#stone-black)"/>
      <!-- White stones -->
      <circle cx="20" cy="380" r="11" fill="url(#stone-white)"/>
      <circle cx="380" cy="20" r="11" fill="url(#stone-white)"/>
      <circle cx="80" cy="200" r="11" fill="url(#stone-white)"/>
      <circle cx="320" cy="200" r="11" fill="url(#stone-white)"/>
      <circle cx="200" cy="320" r="11" fill="url(#stone-white)"/>
    </g>
    <!-- Highlight on the most-recently-placed stone (落子无悔: no going back) -->
    <circle cx="200" cy="320" r="18" fill="url(#stone-highlight)"/>
  </g>

  <!-- Top-left: code brackets </> (highlight.js) -->
  <g transform="translate(85, 95)" filter="url(#card-glow)">
    <rect width="130" height="95" rx="12" fill="#161620" opacity="0.7"/>
    <rect width="130" height="95" rx="12" fill="none" stroke="#3a3a4a" stroke-width="1"/>
    <path d="M 38 30 L 22 47 L 38 65" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 30 L 108 47 L 92 65" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="78" y1="26" x2="52" y2="68" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top-right: camera icon (douban-card) -->
  <g transform="translate(985, 95)" filter="url(#card-glow)">
    <rect width="130" height="95" rx="12" fill="#161620" opacity="0.7"/>
    <rect width="130" height="95" rx="12" fill="none" stroke="#3a3a4a" stroke-width="1"/>
    <rect x="35" y="34" width="60" height="42" rx="6" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <path d="M 47 34 L 51 25 L 79 25 L 83 34" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="65" cy="55" r="11" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <path d="M 60 49 L 60 61 L 72 55 Z" fill="#34d399"/>
  </g>

  <!-- Bottom-left: photo grid 2x2 (gallery 5 iterations) -->
  <g transform="translate(85, 485)" filter="url(#card-glow)">
    <rect width="130" height="95" rx="12" fill="#161620" opacity="0.7"/>
    <rect width="130" height="95" rx="12" fill="none" stroke="#3a3a4a" stroke-width="1"/>
    <rect x="25" y="22" width="36" height="26" rx="3" fill="#3b82f6" opacity="0.85"/>
    <rect x="69" y="22" width="36" height="26" rx="3" fill="#7c3aed" opacity="0.85"/>
    <rect x="25" y="52" width="36" height="26" rx="3" fill="#06b6d4" opacity="0.85"/>
    <rect x="69" y="52" width="36" height="26" rx="3" fill="#10b981" opacity="0.85"/>
  </g>

  <!-- Bottom-right: heart with no-toggle indicator (one-way like) -->
  <g transform="translate(985, 485)" filter="url(#card-glow)">
    <rect width="130" height="95" rx="12" fill="#161620" opacity="0.7"/>
    <rect width="130" height="95" rx="12" fill="none" stroke="#3a3a4a" stroke-width="1"/>
    <path d="M 65 67 C 65 67, 35 51, 35 36 C 35 28, 41 23, 49 23 C 55 23, 61 26, 65 31 C 69 26, 75 23, 81 23 C 89 23, 95 28, 95 36 C 95 51, 65 67, 65 67 Z" fill="#ef4444" opacity="0.85"/>
    <!-- Subtle one-way arrow on heart (down, no going up) -->
    <path d="M 65 73 L 65 80 M 60 76 L 65 81 L 70 76" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
</svg>
